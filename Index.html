<!DOCTYPE html>
<html lang="en-US">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorPT</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  WorPT dashboard page. Served by the WorPT Dashboard web app, which fetches this file live from GitHub, so every
  group gets page changes automatically. It talks only to its own Apps Script (google.script.run.gas), never to the
  VM: the server's key stays in Apps Script.
-->
<style>
:root{
  --bg:#0f0f11; --surface:#17171a; --surface2:#131316; --border:#2a2a30; --border2:#353540; --line:#222228;
  --text:#e8e8f0; --muted:#a0a0ae; --accent:#7eb8f7; --accent2:#f7c97e; --accent3:#7ef7c2; --red:#f77e7e;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.4}
a{color:var(--accent)} a:hover{color:#a0ccff}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:6px 8px;color:var(--text)}
/* Drop-down lists open in the computer's own colors on some systems (often white on Windows), which made light
   option text invisible: tell the browser the page is dark, and give the options their own colors. */
html{color-scheme:dark}
option{background:#1b1b20;color:var(--text)}
option:disabled{color:var(--muted)}
input[data-num]{font-family:var(--mono);width:68px}
input[type=checkbox],input[type=radio]{width:17px;height:17px;accent-color:var(--accent)}
textarea{width:100%;min-height:54px;resize:vertical}
::placeholder{color:#8a8a98;opacity:1}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{padding:7px 12px;min-height:34px;border-radius:5px;border:1px solid var(--border2);background:transparent;cursor:pointer;font-family:var(--mono);font-size:11px}
.btn:hover{background:rgba(255,255,255,.05)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.primary:hover{background:#a0ccff}
.btn.danger{border-color:#5a3030;color:#f7a0a0}
.btn.icon{width:32px;min-height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;margin-right:6px;color:inherit;text-decoration:none}
.logo img{height:46px;width:auto;display:block}
.logo .words{display:flex;flex-direction:column;line-height:1.15}
.logo b{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--text)}
.logo b i{font-style:normal;color:var(--accent);font-weight:700}
.logo .words span{font-size:10px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button,.tabs button{padding:7px 14px;min-height:34px;border-radius:5px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:12px}
.nav button[aria-current=page],.tabs button[aria-current=page]{background:rgba(126,184,247,.14);color:var(--accent)}
.nav button:hover,.tabs button:hover{color:var(--text)}
.top-right{margin-left:auto;display:flex;gap:14px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
#save.saving{color:var(--accent2)} #save.saved{color:var(--accent3)}
.banner{padding:8px 18px;background:#2a2410;border-bottom:1px solid #4a3f1a;color:#f7e0a8;font-size:12px}
.wrap{padding:14px 18px}
.ptitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:2px 0 10px}
.ptitle h1{margin:0;font-size:17px;font-weight:600}
.ptitle .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px}
.h2{margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-size:13px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.empty{padding:30px 0;color:var(--muted);font-size:14px;line-height:1.6}
/* proposals */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;min-height:110px}
.pcard:hover{border-color:var(--border2);background:#1b1b1f}
.pcard b{font-size:14px}
/* plan */
.btn.on{border-color:var(--accent);background:rgba(126,184,247,.14);color:var(--accent)}
.sg-head,.sg-row{display:grid;align-items:center}
#plan-scroll{container-type:inline-size;overflow:auto;max-height:max(340px,calc(100vh - 150px))}
#plan-scroll .sg-head{position:sticky;top:0;z-index:6;background:var(--surface)}
.zoomed .pin{position:sticky;z-index:2;background:var(--surface);align-self:stretch;display:flex;align-items:center}
.zoomed .sg-h.pin{align-items:flex-end}
.zoomed .sg-h.c.pin{flex-direction:column;justify-content:flex-end}
.zoomed .sg-cell.pin{justify-content:center}
.zoomed .sg-sum.pin{justify-content:center}
.zoomed .sg-details{position:sticky;left:0;width:100cqw;box-sizing:border-box}
.sg-head{align-items:end;border-bottom:1px solid var(--border2)}
.sg-h{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);padding:4px;text-transform:uppercase}
.sg-h.c{text-transform:none;text-align:center;line-height:1.3;letter-spacing:0}
.sg-h.c b{color:var(--text)}
.sg-row{height:24px;border-top:1px solid #1e1e23;user-select:none}
.sg-row.cat{height:28px;border-top-color:var(--border)}
.sg-row.open{background:rgba(126,184,247,.06)}
.sg-lab{font-family:var(--mono);font-size:11px;color:var(--accent);padding:0 4px}
.sg-title{text-align:left;border:0;background:transparent;cursor:pointer;padding:2px 4px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sg-title:hover{color:var(--accent)}
.sg-row.cat .sg-title{font-weight:600}
.sg-cell{display:flex;align-items:center;justify-content:center;gap:1px}
/* problems from Checks, marked on the plan (hover one to read it) */
.sg-lab .bad{color:#fff;background:#c9392f;border-radius:3px;padding:1px 4px;cursor:help}
.sg-cell.bad input.wk{border-color:#ff7b72;box-shadow:inset 0 0 0 1px #ff7b72}
.sg-h.c.bad .who i,.sg-h.c.bad b{color:#ff7b72}
.sg-h.c.bad{cursor:help}
.sg-head .tl .over{position:absolute;bottom:0;height:4px;background:#ff7b72;border-radius:2px;cursor:help;z-index:1}
.sg-sum{text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.unf{font-family:var(--mono);font-size:10px;color:var(--accent2);padding-left:3px;white-space:nowrap}
.sub.unf{padding-left:0;color:var(--accent2)}
.sg-h.c .who{display:block;position:relative}
.sg-h.c .who i{position:absolute;left:calc(50% - 8px);bottom:3px;transform-origin:0 100%;transform:rotate(-45deg);font-style:normal;white-space:nowrap;color:var(--text);font-size:11px;font-weight:600}
.sg-ctl{grid-column:1/3;align-self:stretch;display:flex;flex-direction:column;gap:6px;padding:2px 8px 0 0;min-width:0}
.sg-ctl>.sg-h{margin-top:auto}
.zoomed .sg-ctl.pin{display:flex;align-items:stretch}
.sg-ctl .row{gap:4px;flex-wrap:nowrap;white-space:nowrap}
.sg-ctl .btn{min-height:26px;padding:3px 8px}
.sg-ctl .h2{margin:0 6px 0 0}
.sg-ctl .sg-h{padding:4px 4px 4px 0}
input.wk{width:34px;padding:1px 3px;text-align:right;font-size:11px;line-height:1.2;border-color:#2a2a30}
input.wk.on{border-color:#4a6a90}
.star{border:0;background:transparent;cursor:pointer;padding:0 1px;font-size:12px;color:#4a4a55}
.star.lead{color:var(--accent2)} .star.none{color:transparent;cursor:default}
.tl{position:relative;height:100%;display:grid}
.tl.cal{background-image:var(--calbg)}
.tl.leaf{touch-action:none}
.sg-head .tl{height:auto}
.yh{grid-column:span 4;text-align:center;font-family:var(--mono);font-size:11px;padding:3px 0;border-left:1px solid #5a5a68}
.qh{text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);padding:2px 0 5px;border-left:1px solid #454552}
.qh.y{border-left-color:#5a5a68}
.bar{position:absolute;pointer-events:none;display:flex;align-items:center;padding:0 8px;font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:visible}
.bar.leaf{top:17%;bottom:17%;border-radius:5px;background:rgba(126,184,247,.55);box-shadow:inset 5px 0 0 rgba(255,255,255,.5),inset -5px 0 0 rgba(255,255,255,.5)}
.bar.leaf.sub{background:rgba(126,184,247,.42)}
.bar.parent{top:28%;bottom:28%;border-radius:4px;background:rgba(247,201,126,.14);border:1px dashed rgba(247,201,126,.55)}
.bar.cat{top:40%;bottom:40%;border-radius:3px;background:rgba(247,201,126,.55);box-shadow:-2px 0 0 rgba(247,201,126,.9),2px 0 0 rgba(247,201,126,.9)}
.tsum{display:flex;gap:10px;align-items:flex-start}
.tsum textarea{flex:1 1 240px}
.rolepick{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}.rolepick select{width:150px}.rolepick input{width:120px}
.tsum .roles{flex:1 1 200px;min-width:180px;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.4}
.tsum .roles ul{margin:0 0 4px;padding-left:16px}
.tsum .roles .btn{align-self:flex-start;margin-top:4px}
.sg-details{margin:4px 0 12px 52px;max-width:840px;background:#1b2332;border:1px solid #3d5a80;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.badge{font-family:var(--mono);font-size:12px;color:var(--accent);padding:3px 8px;border:1px solid #2a3a50;border-radius:4px}
.level{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
fieldset{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:0}
legend{font-size:11px;color:var(--muted);padding:0 4px}
.pgrid{display:grid;grid-template-columns:minmax(0,1.8fr) 44px minmax(150px,1.6fr) minmax(0,1.2fr) 36px;gap:8px;align-items:center}
.pgrid.head{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prow{padding:6px 0;border-top:1px solid var(--line)}
.fte{font-family:var(--mono);font-size:11px;color:var(--accent3);white-space:nowrap}
.sub{font-family:var(--mono);font-size:10px;color:var(--muted)}
.rgrid{display:grid;gap:2px;min-width:330px}
.rgrid .c{display:flex;justify-content:flex-end;align-items:baseline;flex-wrap:wrap;column-gap:6px;padding:6px 4px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;border-radius:4px;transition:background .5s}
.rgrid .c.all{background:rgba(255,255,255,.03);font-weight:600}
.rgrid .c.lit{background:rgba(126,247,194,.22)}
.rgrid .n{padding:6px 4px;border-top:1px solid var(--line);min-width:0;display:flex;align-items:baseline;gap:8px}
.rgrid .n .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rgrid .c.over>span:first-child{color:#ff7b72;font-weight:700}
.rgrid .hd{font-family:var(--mono);font-size:10px;color:var(--muted);padding:4px;text-align:right}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:baseline;line-height:1.45}
.checks .where{font-family:var(--mono);font-size:10px;color:var(--bg);background:var(--accent2);border-radius:3px;padding:1px 5px;white-space:nowrap}
.checks .where.fix{background:#f7a07e}
/* tables */
table.t{border-collapse:collapse;width:100%}
table.t th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px;border-bottom:1px solid var(--border)}
table.t td{padding:6px;border-top:1px solid var(--line);vertical-align:top}
table.t td.num{text-align:right;font-family:var(--mono)}
.scroll{overflow-x:auto}
pre.latex{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;overflow:auto;max-height:65vh;font-size:11.5px;line-height:1.45;white-space:pre}
.tlist button{display:block;width:100%;text-align:left;padding:8px 10px;min-height:34px;border-radius:5px;border:1px solid transparent;background:transparent;cursor:pointer}
.tlist button[aria-current=true]{background:rgba(126,184,247,.10);border-color:#2a3a50}
.tlist .sub{display:block}
/* modal and toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:50;overflow:auto}
#modal[hidden]{display:none}
.dialog{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:18px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.dialog h2{margin:0;font-size:15px}
.dialog .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare div{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(640px,92vw);background:#2a1618;border:1px solid #5a3030;color:#f7c0c0;padding:10px 14px;border-radius:8px;z-index:60;line-height:1.5}
#toast[hidden]{display:none}
.versions{padding:14px 18px 18px;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right}
.nav button.back{color:var(--accent);box-shadow:inset 0 0 0 1px var(--border2)}
.nav button.back:hover{background:rgba(126,184,247,.10);color:var(--accent)}
#toast.ok{background:#14261e;border-color:#245a40;color:#bff0d8}
@media (max-width:700px){.top-right{margin-left:0}.pgrid{grid-template-columns:minmax(0,1fr) 40px minmax(0,1.3fr) minmax(0,1.2fr) 34px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="https://github.com/pmarcum/WorPT" target="_blank" rel="noopener" title="WorPT on GitHub"><img src="https://raw.githubusercontent.com/pmarcum/WorPT/main/images/worpt-logo-dark.png" alt="WorPT" width="75" height="46"><span class="words"><b><i>Wor</i>k <i>P</i>lan <i>T</i>ool</b><span>for proposals</span></span></a>
  <nav class="nav" aria-label="Main">
    <button type="button" data-go="proposals">Proposal Work Plans</button>
    <button type="button" data-go="people">People &amp; profiles</button>
  </nav>
  <div class="top-right"><span id="save" aria-live="polite"></span><span id="who"></span></div>
</header>
<div id="banner"></div>
<main class="wrap" id="app"><p class="empty">Opening WorPT…</p></main>
<div id="modal" hidden></div>
<div id="toast" role="alert" hidden></div>
<footer id="versions" class="versions"></footer>

<script>
'use strict';
// ── state ────────────────────────────────────────────────────────────────────────────────────────────────────
const S = {
  cfg: null, me: null, view: 'proposals', proposals: [], people: [], pid: null, P: null, prev: null,
  tab: 'plan', sel: null, lastChange: 0, lit: {}, saving: 0, table: null, tableOut: null, snaps: null,
};
const TABS = [['plan', 'Plan'], ['team', 'Team'], ['budget', 'Travel & budget'], ['tables', 'Tables'], ['snapshots', 'Snapshots'], ['settings', 'Settings']];
const TABLE_NAMES = {
  NOTANONschedule: ['Schedule', 'named'], NOTANONtasks: ['Task list', 'named'], NOTANONfte: ['FTE by person', 'named'],
  NOTANONteamSummaries: ['Team summaries', 'named'], NOTANONhst: ['HST roles', 'named'], isANONtasks: ['Task list', 'anonymous'],
  isANONfte: ['FTE by role', 'anonymous'], isANONtravel: ['Travel', 'anonymous'], isANONnonlabor: ['Non-labor budget', 'anonymous'],
  worpt: ['worpt.sty', 'load once with \\usepackage{worpt}'],
};
const POLL_MS = 10000;

// ── small helpers ────────────────────────────────────────────────────────────────────────────────────────────
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f2 = x => (Math.round((+x || 0) * 100) / 100).toFixed(2);
const money = x => '$' + Math.round(+x || 0).toLocaleString('en-US');
const fteStep = x => { const s = x < 0.1 ? 0.01 : 0.05; return Math.round(x / s) * s; };
// Numbers are always written with a decimal point, whatever the browser's language: inputs are plain text, and a comma
// is read as a decimal point in weeks and other small numbers (3,5 = 3.5) and as a thousands separator in dollars (3,000).
const num = (v, money) => {
  if (v === '' || v == null) return null;
  let t = String(v).trim().replace(/\s/g, '');
  t = (t.includes('.') || money) ? t.replace(/,/g, '') : t.replace(/,/g, '.');
  return t === '' || isNaN(+t) ? null : +t;
};
const when = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }); };
const personName = p => p ? [p.first, p.last].filter(Boolean).join(' ') || '(no name)' : '';
const isColl = m => /^coll/i.test(m.role || '') || m.us === false;
// how wide a text is, in pixels: font is weight and size ('600 11px'), family a font variable of the page ('--mono')
function textWidth(t, font, family) {
  const g = (textWidth.g = textWidth.g || document.createElement('canvas').getContext('2d'));
  g.font = font + ' ' + getComputedStyle(document.documentElement).getPropertyValue(family); return g.measureText(t).width;
}
const shortName = p => p ? ([p.first, p.last ? p.last[0] + '.' : ''].filter(Boolean).join(' ') || '(no name)') : '';
const wk = x => String(+(+x || 0).toFixed(2));        // weeks as typed: 1, 0.5, 1.25
// a member's label comes from their role (PI, co-I 1, collab 1…), never their name, so proposals can stay anonymous
const idRole = m => m.short_id;
// Roles are chosen from a list; WorPT numbers co-Is, collaborators, grad students and postdocs by itself (co-I 1, co-I 2…).
const ROLES = [['PI', 'PI'], ['Sci-PI', 'Sci-PI (science PI)'], ['Admin-PI', 'Admin-PI (administrative PI)'], ['co-I', 'co-I'],
  ['coll', 'Collaborator'], ['gst', 'Grad student'], ['pd', 'Postdoc'], ['other', 'Other…']];
const roleKind = role => {
  const b = String(role || '').replace(/\(\s*\d+\s*\)\s*$/, '').trim().toLowerCase();
  return { pi: 'PI', 'sci-pi': 'Sci-PI', 'admin-pi': 'Admin-PI', 'co-i': 'co-I', coi: 'co-I', 'co-investigator': 'co-I', coll: 'coll', collab: 'coll',
    collaborator: 'coll', gst: 'gst', grad: 'gst', 'grad student': 'gst', 'graduate student': 'gst', pd: 'pd', postdoc: 'pd' }[b] || (b ? 'other' : '');
};
/** A role list with an "Other…" box. key: "member:<id>" (saves itself) or a form's name (read with pickedRole). */
function rolePicker(key, role, attrs, blank) {
  const kind = roleKind(role), saves = key.startsWith('member:') ? ' data-save="' + key + ':role"' : '';
  return '<span class="rolepick"><select data-rolekind="' + key + '" aria-label="Role"' + attrs + '>' + (blank ? '<option value="">Choose…</option>' : '') +
    ROLES.map(([v, t]) => '<option value="' + v + '"' + (v === kind ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select>' +
    '<input data-roleother="' + key + '"' + saves + ' value="' + (kind === 'other' ? esc(role) : '') + '" placeholder="e.g. consultant" aria-label="Role, in your own words"' +
    (kind === 'other' ? '' : ' hidden') + attrs + '></span>';
}
const pickedRole = key => { const k = $('[data-rolekind="' + key + '"]').value; return k === 'other' ? $('[data-roleother="' + key + '"]').value.trim() : k; };

function gas(fn, ...args) {
  return new Promise((resolve, reject) => google.script.run
    .withSuccessHandler(resolve)
    .withFailureHandler(e => reject({ code: 'apps_script', message: String((e && e.message) || e) }))
    .gas(fn, ...args));
}
async function api(fn, ...args) { const r = await gas(fn, ...args); if (!r || r.status !== 'ok') throw r || { message: 'No answer.' }; return r; }

function setSaving(d) {
  S.saving += d;
  const el = $('#save');
  if (S.saving > 0) { el.textContent = 'Saving…'; el.className = 'saving'; }
  else { el.textContent = 'Saved'; el.className = 'saved'; clearTimeout(setSaving.t); setSaving.t = setTimeout(() => { el.textContent = ''; }, 2500); }
}
function toast(msg, ok) {
  const t = $('#toast'); t.textContent = msg; t.className = ok ? 'ok' : ''; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, ok ? 3000 : 9000);
}

/** A change to the open proposal: the change and the proposal as it now stands come back together. */
async function change(fn, ...args) {

  try {
    const out = await gas('change', S.pid, fn, ...args);
    if (!out.result || out.result.status !== 'ok') throw out.result || { message: 'No answer.' };
    if (out.proposal && out.proposal.status === 'ok') applyProposal(out.proposal);
    return out.result;
  } finally { setSaving(-1); }
}

// ── saving a field ───────────────────────────────────────────────────────────────────────────────────────────
// Inputs carry data-save="kind:id:field" (and data-version). They save when you leave them or press Enter.
const UPDATE = { proposal: 'updateProposal', item: 'updateItem', member: 'updateMember', assignment: 'updateAssignment', nonlabor: 'updateNonlabor', person: 'updatePerson' };
const WHAT = { proposal: 'work plan', item: 'item', member: 'team member', assignment: 'assignment', nonlabor: 'budget line', person: 'profile' };

function readInput(el) {
  if (el.type === 'checkbox' || el.type === 'radio') return el.checked;
  if (el.dataset.num) return el.dataset.type === 'int' ? Math.round(num(el.value) || 0) || null : num(el.value, el.dataset.num === 'money');
  if (el.dataset.type === 'int') return el.value === '' ? null : parseInt(el.value, 10);
  return el.value;
}
async function saveFields(kind, id, version, fields) {
  const fn = UPDATE[kind];
  try {
    if (kind === 'proposal') return await change(fn, id, Object.assign({ version }, fields));
    if (kind === 'person' && !S.pid) { setSaving(+1); try { return await api(fn, id, Object.assign({ version }, fields)); } finally { setSaving(-1); } }
    return await change(fn, id, Object.assign({ version }, fields));
  } catch (e) {
    if (e && e.code === 'conflict') return conflict(kind, id, fields, e.current);
    showError(e);
    if (S.pid) reloadProposal(); else render();
  }
}
async function conflict(kind, id, fields, current) {
  const show = v => typeof v === 'object' ? JSON.stringify(v) : String(v == null ? '—' : v);
  const keys = Object.keys(fields);
  const theirs = keys.map(k => k + ': ' + show(current && current[k])).join('\n'), mine = keys.map(k => k + ': ' + show(fields[k])).join('\n');
  const choice = await new Promise(resolve => modal(
    '<h2>Someone else changed this ' + esc(WHAT[kind]) + ' first</h2><p style="margin:0">Your change was not saved. Which should stand?</p>' +
    '<div class="compare"><div><b>Theirs (saved)</b>\n' + esc(theirs) + '</div><div><b>Yours</b>\n' + esc(mine) + '</div></div>' +
    '<div class="actions"><button type="button" class="btn" data-c="theirs">Keep theirs</button><button type="button" class="btn primary" data-c="mine">Use mine</button></div>',
    m => m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { closeModal(); resolve(b.dataset.c); })));
  if (choice === 'mine' && current) return saveFields(kind, id, current.version, fields);
  if (S.pid) reloadProposal(); else render();
}
document.addEventListener('change', e => {
  const pick = e.target.closest('select[data-rolekind]');
  if (pick) {                                     // a role from the list; "Other…" opens a box for the role in your own words
    const other = document.querySelector('[data-roleother="' + pick.dataset.rolekind + '"]');
    other.hidden = pick.value !== 'other';
    if (pick.value === 'other') { other.focus(); return; }
    const [kind, id] = pick.dataset.rolekind.split(':');
    if (kind === 'member') saveFields('member', +id, +pick.dataset.version, { role: pick.value });
    return;
  }
  const el = e.target.closest('[data-save]');
  if (!el) return;
  const [kind, id, field] = el.dataset.save.split(':');
  saveFields(kind, kind === 'proposal' ? id : +id, +el.dataset.version, { [field]: readInput(el) });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input[data-save]')) e.target.blur();
});
// The FTE beside a weeks box follows what you type, before anything is saved.
document.addEventListener('input', e => {

/** The top bar: "Proposal Work Plans" becomes "← All Proposal Work Plans" while a work plan is open. */
function setNav(view) {

function go(view) {

/** A fresh copy of the proposal arrived: work out what changed in the ripple panel, then redraw. */
// The dashboard lists the team as PI, Admin-PI, Sci-PI, then by last name (then first name).
const ROLE_RANK = { pi: 0, 'admin-pi': 1, 'sci-pi': 2 };
const teamOrder = (a, b) => (ROLE_RANK[(a.role || '').toLowerCase()] ?? 3) - (ROLE_RANK[(b.role || '').toLowerCase()] ?? 3) ||
  (a.last || '').localeCompare(b.last || '', 'en', { sensitivity: 'base' }) || (a.first || '').localeCompare(b.first || '', 'en', { sensitivity: 'base' }) || a.id - b.id;

function applyProposal(r) {
  const old = S.P && S.P.computed;
  r.members.sort(teamOrder);
  S.P = r; S.lastChange = r.last_change || 0;
  S.lit = {};
  if (old) {
    Object.keys(r.computed.people).forEach(mid => {
      const a = r.computed.people[mid], b = old.people[mid];
      const cells = a.per_year.concat([a.total]), was = b ? b.per_year.concat([b.total]) : [];
      cells.forEach((c, y) => { if (!was[y] || Math.abs(c[0] - was[y][0]) > 1e-9 || Math.abs(c[1] - was[y][1]) > 1e-9) S.lit[mid + ':' + y] = true; });
    });
    if (Object.keys(S.lit).length) { clearTimeout(applyProposal.t); applyProposal.t = setTimeout(() => { document.querySelectorAll('.rgrid .c.lit').forEach(c => c.classList.remove('lit')); S.lit = {}; }, 1600); }
  }
  if (S.sel && !r.items.some(i => i.id === S.sel)) S.sel = null;
  if (S.open && !r.items.some(i => i.id === S.open)) S.open = null;
  if (!S.sel) { const first = leafOrder()[0] || r.items[0]; S.sel = first ? first.id : null; }
  S.snaps = null;                                   // the list is fetched again when the Snapshots tab is shown
  if (S.tab === 'tables' && S.table) loadTable(S.table, true);
  render();
}

// Others' changes: ask every 10 seconds whether anything changed, while the page is visible and nobody is typing.
setInterval(async () => {
  if (S.view !== 'proposal' || !S.pid || document.visibilityState !== 'visible' || S.saving || DRAG || !$('#modal').hidden) return;
  if (document.activeElement && document.activeElement.matches('input,textarea,select')) return;
  try {
    const r = await api('changed', S.pid);
    if (r.last_change > S.lastChange && !S.saving) await reloadProposal();
  } catch (e) { /* quiet: the next check tries again */ }
}, POLL_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.pid) reloadProposal(); });

// ── drawing (keeps the focus and anything half-typed when the page redraws) ──────────────────────────────────
function render() {
  const a = document.activeElement, key = a && a.dataset && (a.dataset.save || a.dataset.key);
  const typed = a && key && a.matches('input:not([type=checkbox]):not([type=radio]),textarea') ? { value: a.value, s: a.selectionStart, e: a.selectionEnd, dirty: a.value !== a.defaultValue } : null;
  const html = S.view === 'proposal' && S.P ? viewProposal() : S.view === 'people' ? viewPeople() : viewProposals();
  const was = $('#plan-scroll'), scrollX = was ? was.scrollLeft : 0, scrollY = was ? was.scrollTop : 0;
  $('#app').innerHTML = html;
  const sc = $('#plan-scroll');
  if (sc) {
    const cal = sc.querySelector('.tl.cal');
    if (S.zoomKeep != null && cal) {
      const r = cal.getBoundingClientRect(), v = sc.getBoundingClientRect();
      sc.scrollLeft += (r.left + S.zoomKeep * r.width) - (v.left + v.width / 2);
    } else sc.scrollLeft = scrollX;
    sc.scrollTop = scrollY;
  }
  S.zoomKeep = null;
  if (sc && planZoom() === 0 && sc.scrollWidth > sc.clientWidth + 1 && !S.refit) { S.refit = true; render(); S.refit = false; }
  if (key) {
    const b = document.querySelector('[data-save="' + CSS.escape(key) + '"],[data-key="' + CSS.escape(key) + '"]');
    if (b) {
      if (typed && typed.dirty) b.value = typed.value;
      b.focus();
      if (typed && b.setSelectionRange) try { b.setSelectionRange(typed.s, typed.e); } catch (e) { /* number inputs */ }
    }
  }
  wire();
}

// The tree, in order, with depth and label.

}

/** What the plan says about one member: the tasks they lead, the tasks they support (by name or through "team"), and their FTE. */
function planRoles(m) {
  const P = S.P, order = tree().filter(n => n.depth > 0 && !n.kids).map(n => n.item), lead = [], support = [];
  order.forEach(it => {
    const work = P.assignments.filter(a => a.item_id === it.id);
    const mine = work.find(a => !a.is_team && a.member_id === m.id), team = work.find(a => a.is_team);
    const entry = a => ({ label: labelOf(it.id), title: it.title, weeks: +a.weeks || 0, span: it.start_year ? span([it.start_year, it.start_week], [it.end_year, it.end_week]) : 'no timeline yet', team: a.is_team });
    if (mine) (mine.is_lead ? lead : support).push(entry(mine));
    else if (team) support.push(entry(team));
  });
  return { lead, support };
}
function planSummary(m) {
  const r = planRoles(m), c = (S.P.computed.people[m.id] || { per_year: [], total: [0] });
  const li = e => '<li><b>' + esc(e.label) + '</b> ' + esc(e.title) + ' <span class="sub">' + esc(e.span) + ', ' + e.weeks + ' wk' + (e.team ? ', as part of the team' : '') + '</span></li>';
  const fte = c.per_year.map((v, y) => 'Year ' + (y + 1) + ' ' + f2(v[0])).join(' · ') + ' · all ' + f2(c.total[0]);
  return (r.lead.length ? '<div class="sub">Task lead on</div><ul>' + r.lead.map(li).join('') + '</ul>' : '') +
    (r.support.length ? '<div class="sub">Supports</div><ul>' + r.support.map(li).join('') + '</ul>' : '') +
    (r.lead.length || r.support.length ? '<div class="sub">FTE: ' + esc(fte) + '</div>' : '<div class="sub">Not on any task yet.</div>');
}
/** A first paragraph for the team summary, built from the plan and the person's profile (no AI): edit it freely. */
function draftSummary(m) {
  const r = planRoles(m);
  const join = xs => xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + (xs.length > 2 ? ',' : '') + ' and ' + xs[xs.length - 1];
  const task = e => 'Task ' + e.label + ' (' + e.title + ')';
  const name = m.prefix ? m.prefix + ' ' + m.last : personName(m);
  const subject = { she: 'She', he: 'He', they: 'They' }[m.pronoun] || name;
  const expertise = join((m.expertise || '').split(/\s*;\s*/).filter(Boolean));
  const out = [];
  if (r.lead.length) out.push(name + ' will lead ' + join(r.lead.map(task)) + (expertise ? ', drawing on expertise in ' + expertise : '') + '.');
  if (r.support.length) out.push((r.lead.length ? subject + ' will also support ' : name + ' will support ') + join(r.support.map(task)) +
    (!r.lead.length && expertise ? ', contributing expertise in ' + expertise : '') + '.');
  return out.join(' ');
}

    years.map(y => '<td><input type="text" inputmode="decimal" data-num="money" data-nl="' + r.id + ':' + y + '" data-key="nl:' + r.id + ':' + y + '" value="' + esc((r.amounts || [])[y] || 0) + '" style="width:90px" aria-label="' + esc(r.item) + ' year ' + (y + 1) + '"></td>').join('') +

  return '<div class="stack">' +

// ── settings ─────────────────────────────────────────────────────────────────────────────────────────────────
function viewSettings() {
  const p = S.P.proposal, v = ' data-version="' + p.version + '"', can = S.P.you.can_manage_team;
  return '<div class="cols"><div class="card stack" style="flex:2 1 460px">' +
    '<label class="f">Title<input data-save="proposal:' + esc(p.id) + ':title"' + v + ' value="' + esc(p.title) + '"></label>' +
    '<label class="f">Program (contains "HST": team summaries use full role names)<input data-save="proposal:' + esc(p.id) + ':program"' + v + ' value="' + esc(p.program) + '"></label>' +
    '<div class="row"><label class="f">Years<input type="text" inputmode="decimal" data-num="dec" data-type="int" data-save="proposal:' + esc(p.id) + ':n_years"' + v + ' value="' + p.n_years + '"></label>' +
    '<label class="f">FTE rounding<select data-save="proposal:' + esc(p.id) + ':rounding"' + v + '><option value="nearest"' + (p.rounding === 'nearest' ? ' selected' : '') + '>to the nearest step</option>' +
    '<option value="up"' + (p.rounding === 'up' ? ' selected' : '') + '>up</option></select></label></div>' +
    '<p class="hint">Created ' + esc(when(p.created_at)) + ' by ' + esc(p.created_by) + '.</p>' +
    '<div class="row" style="align-items:center"><span>Work plan ID</span><code id="wp-id" style="font-family:var(--mono);padding:4px 8px;border:1px solid var(--border2);border-radius:5px">' + esc(p.id) + '</code>' +
    '<button type="button" class="btn" data-act="copyId">Copy</button></div>' +
    '<p class="hint" style="margin-top:0">gooTeX uses this ID to bring this work plan\'s tables into a document.</p></div>' +
    (can ? '<div class="card stack" style="flex:1 1 300px;border-color:#5a3030"><h2 class="h2">Delete this work plan</h2><p style="margin:0;line-height:1.5">Deletes the whole work plan for everyone (WorPT keeps a copy in its records). Type the title exactly to confirm.</p>' +
      '<input id="del-title" aria-label="Type the title to confirm" placeholder="' + esc(p.title) + '"><div><button type="button" class="btn danger" data-act="deleteProposal">Delete work plan</button></div></div>' : '') + '</div>';
}

// ── actions ──────────────────────────────────────────────────────────────────────────────────────────────────
async function attempt(fn) { try { return await fn(); } catch (e) { if (e && e.code === 'conflict') { toast('Someone else changed this first; showing the current version.'); reloadProposal(); } else showError(e); } }

// Up and down show at once; the saves go to the server one after another (each to the place it was clicked to), and the
// plan is refreshed from the server after the last one, so quick clicks are neither lost nor undone by a slow answer.
function moveBy(id, by) {
  const it = S.P.items.find(i => i.id === id); if (!it) return;
  const sibs = S.P.items.filter(i => i.parent_id === it.parent_id).sort((a, b) => a.position - b.position || a.id - b.id);
  const k = sibs.indexOf(it), to = k + by; if (to < 0 || to >= sibs.length) return;
  sibs.splice(k, 1); sibs.splice(to, 0, it); sibs.forEach((x, n) => x.position = n);
  render();
  S.mv = (S.mv || 0) + 1; setSaving(+1);
  S.mvq = (S.mvq || Promise.resolve()).then(async () => {
    try {
      if (S.mvFailed) return;
      const out = await gas('change', S.pid, 'updateItem', it.id, { version: it.version, parent_id: it.parent_id, position: to });
      if (!out.result || out.result.status !== 'ok') throw out.result || { message: 'No answer.' };
      it.version = out.result.item.version;
      if (S.mv === 1 && out.proposal && out.proposal.status === 'ok') applyProposal(out.proposal);
    } catch (e) { S.mvFailed = true; showError(e); }
    finally {
      S.mv--; setSaving(-1);
      if (!S.mv && S.mvFailed) { S.mvFailed = false; reloadProposal(); }       // something went wrong: show what the server has
    }
  });
}

async function addItem(parentId, title) {
  try { const r = await change('addItem', S.pid, { parent_id: parentId, title }); S.sel = S.open = r.item.id; render(); }
  catch (e) {
    if (e && e.code !== 'parent_has_effort') return showError(e);
    const dest = await ask('Where should its effort go?', e.message, [['Move it into the new subtask', 'new_child', 'primary'], ['Remove it', 'remove', 'danger']]);
    if (!dest) return;
    await attempt(async () => { const r = await change('addItem', S.pid, { parent_id: parentId, title, effort_destination: dest }); S.sel = S.open = r.item.id; render(); });
  }
}

const ACTIONS = {
  newProposal, newPerson: async () => { const p = await editPerson(null); if (p && S.pid) { await loadPeople(); render(); } },
  addCategory: () => addItem(null, 'New task category'),
  addTask: () => { const n = tree().find(x => x.item.id === S.sel); let g = n && n.item; while (g && g.parent_id != null) g = S.P.items.find(i => i.id === g.parent_id); if (g) addItem(g.id, 'New task'); },
  addSub: () => { const n = tree().find(x => x.item.id === S.sel); if (!n || n.depth === 0) return; addItem(n.depth === 2 ? n.item.parent_id : n.item.id, 'New subtask'); },
  closeDetails: () => { S.open = null; render(); },
  saveSnapshot: () => attempt(async () => {
    await api('saveSnapshot', S.pid, $('#snap-name').value);
    S.snaps = null; toast('Snapshot saved.', true); render();
  }),
  deleteItem: () => attempt(async () => {
    const pre = await api('deleteItem', S.sel, false);
    const ok = await ask('Delete this item?', pre.message + ' A snapshot is saved first, so it can be undone.', [['Delete', true, 'danger']]);
    if (ok) await change('deleteItem', S.sel, true);
  }),
  addMember: () => attempt(async () => {
    const person = num($('#am-person').value);
    if (!person) return toast('Choose a person (or make one with New person…).');
    const role = pickedRole('am');
    if (!role) return toast('Choose a role for them.');
    await change('addMember', S.pid, { person_id: person, role, is_lead: $('#am-lead').checked });
    toast('Added to the team.', true);
  }),
  addNonlabor: () => attempt(() => change('addNonlabor', S.pid, { item: 'New item', amounts: Array(S.P.proposal.n_years).fill(0) })),
  copyId: async () => {
    try { await navigator.clipboard.writeText(S.P.proposal.id); toast('Work plan ID copied.', true); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($('#wp-id')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press Ctrl+C (or ⌘C) to copy the selected ID.', true); }
  },
  copyTable: async () => {
    const text = S.tableOut ? S.tableOut.latex : '';
    try { await navigator.clipboard.writeText(text); toast('LaTeX copied.', true); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($('#latex')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press Ctrl+C (or ⌘C) to copy the selected LaTeX.', true); }
  },
  deleteProposal: () => attempt(async () => {
    await api('deleteProposal', S.pid, $('#del-title').value);
    toast('Work plan deleted.', true); go('proposals');
  }),
};

// The calendar follows the window: its width (fitted) and its screen pixels (browser zoom).
let refitTimer = null;
// the header's names are measured in the page's font, which may arrive after the first drawing
if (document.fonts) document.fonts.ready.then(() => { if (S.view === 'proposal' && S.P && $('#plan-scroll') && !DRAG) render(); });
window.addEventListener('resize', () => {
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => { if (S.view === 'proposal' && S.P && $('#plan-scroll') && !DRAG) render(); }, 150);   // also on browser zoom: screen pixels change
});

// ── dragging a bar on the calendar (shown live; saved once, when the mouse is let go) ───────────────────────────
let DRAG = null;
function startDrag(ev, tl) {
  if (ev.button !== 0) return;
  const id = +tl.dataset.tl, it = S.P.items.find(i => i.id === id), NQ = S.P.proposal.n_years * WEEKS, r = tl.getBoundingClientRect();
  const qAt = x => Math.max(0, Math.min(NQ - 1, Math.floor((x - r.left) / r.width * NQ)));      // the week under the pointer
  const q = qAt(ev.clientX), s = wIndex(it.start_year, it.start_week), e = wIndex(it.end_year, it.end_week);
  const mode = barZone(ev, tl) || 'draw';
  let bar = tl.querySelector('.bar');
  if (!bar) { bar = document.createElement('span'); bar.className = 'bar leaf'; tl.appendChild(bar); }
  DRAG = { id, it, NQ, qAt, mode, a: q, s0: s, e0: e, s: mode === 'draw' ? q : s, e: mode === 'draw' ? q : e, bar };
  placeBar(); ev.preventDefault();
  try { tl.setPointerCapture(ev.pointerId); } catch (err) { /* older browsers: the drag still works inside the row */ }
}
/** Where the pointer is on a bar: near either end (within 16 pixels, or a third of a short bar) resizes, the rest moves. */
function barZone(ev, tl) {
  const bar = tl.querySelector('.bar'); if (!bar) return null;
  const r = bar.getBoundingClientRect(), x = ev.clientX, grip = Math.min(16, r.width / 3);
  if (x < r.left - 6 || x > r.right + 6) return null;
  return x - r.left <= grip ? 'start' : r.right - x <= grip ? 'end' : 'move';
}
function hoverBar(ev, tl) {
  const z = barZone(ev, tl);
  tl.style.cursor = z === 'start' || z === 'end' ? 'ew-resize' : z === 'move' ? 'grab' : 'crosshair';
}
function placeBar() {
  const d = DRAG;
  d.bar.style.left = 'calc(' + (d.s / d.NQ * 100) + '% + 1px)'; d.bar.style.width = 'calc(' + ((d.e - d.s + 1) / d.NQ * 100) + '% - 2px)';
  d.bar.textContent = ywText(d.s) + ' – ' + ywText(d.e);              // the exact span while dragging
}
function moveDrag(ev) {
  const d = DRAG; if (!d) return;
  const q = d.qAt(ev.clientX);
  if (d.mode === 'draw') { d.s = Math.min(d.a, q); d.e = Math.max(d.a, q); }
  else if (d.mode === 'start') d.s = Math.min(q, d.e);
  else if (d.mode === 'end') d.e = Math.max(q, d.s);
  else { const len = d.e0 - d.s0, ns = Math.max(0, Math.min(d.NQ - 1 - len, d.s0 + q - d.a)); d.s = ns; d.e = ns + len; }
  placeBar();
}
function endDrag() {
  const d = DRAG; DRAG = null;
  if (!d) return;
  if (d.s === d.s0 && d.e === d.e0) { render(); return; }            // nothing changed: put the bar back as it was
  const [sy, sw] = yw(d.s), [ey, ew] = yw(d.e);
  attempt(() => change('updateItem', d.id, { version: d.it.version, start_year: sy, start_week: sw, end_year: ey, end_week: ew }));
}

function wire() {
  const app = $('#app');
  app.querySelectorAll('[data-zoom]').forEach(b => b.onclick = () => setPlanZoom(b.dataset.zoom === 'fit' ? 0 : planZoom() + +b.dataset.zoom));
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openProposal(b.dataset.open));
  app.querySelectorAll('[data-act]').forEach(b => {
    if (b.tagName === 'SELECT') return;
    b.onclick = () => ACTIONS[b.dataset.act] && ACTIONS[b.dataset.act]();
  });
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; if (S.tab === 'snapshots') S.snaps = null; render(); });
  app.querySelectorAll('[data-openitem]').forEach(b => b.onclick = () => { const id = +b.dataset.openitem; S.open = S.open === id ? null : id; S.sel = id; render(); });
  app.querySelectorAll('[data-teamview]').forEach(b => b.onclick = () => setTeamView(b.dataset.teamview));
  app.querySelectorAll('.tl.leaf').forEach(tl => {
    tl.onpointerdown = ev => startDrag(ev, tl);
    tl.onpointermove = ev => DRAG ? moveDrag(ev) : hoverBar(ev, tl);
    tl.onpointerup = tl.onpointercancel = endDrag;
  });
  // a weeks cell: typing a number assigns the person (the first person on a task becomes its task lead); emptying it, or 0, takes them off
  app.querySelectorAll('input[data-cell]').forEach(el => el.onchange = () => attempt(async () => {
    const [iid, mid] = el.dataset.cell.split(':').map(Number), v = num(el.value) || 0;
    const a = S.P.assignments.find(x => x.item_id === iid && !x.is_team && x.member_id === mid);
    if (a && v > 0) return change('updateAssignment', a.id, { version: a.version, weeks: v });
    if (a) return change('deleteAssignment', a.id);
    if (v > 0) return change('addAssignment', iid, { member_id: mid, weeks: v, is_lead: !S.P.assignments.some(x => x.item_id === iid && x.is_lead) });
  }));
  app.querySelectorAll('[data-star]').forEach(b => b.onclick = () => attempt(() => {
    const a = S.P.assignments.find(x => x.id === +b.dataset.star);
    return change('updateAssignment', a.id, { version: a.version, is_lead: true });
  }));
  app.querySelectorAll('[data-table]').forEach(b => b.onclick = () => loadTable(b.dataset.table));
  app.querySelectorAll('[data-editperson]').forEach(b => b.onclick = async () => {
    const id = +b.dataset.editperson;
    let p = S.people.find(x => x.id === id) || (S.me && S.me.profile && S.me.profile.id === id ? S.me.profile : null);
    if (!p) { await loadPeople(); p = S.people.find(x => x.id === id); }
    if (p) editPerson(p); else toast('You can edit your own profile, or the profiles of people on work plans where you are a full editor.');
  });
  app.querySelectorAll('[data-move]').forEach(b => b.onclick = () => moveBy(S.sel, +b.dataset.move));
  app.querySelectorAll('[data-unassign]').forEach(b => b.onclick = () => attempt(() => change('deleteAssignment', +b.dataset.unassign)));
  app.querySelectorAll('[data-delnl]').forEach(b => b.onclick = () => attempt(() => change('deleteNonlabor', +b.dataset.delnl)));
  app.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => attempt(async () => {
    const s = S.snaps.find(x => x.id === +b.dataset.restore);
    const ok = await ask('Restore this snapshot?', 'The whole work plan (plan, team, budget and settings) goes back to how it was on ' + when(s.at) +
      ' ("' + s.name + '"). Anyone added to the team since then is taken off it. WorPT first saves a snapshot of how things are now, so you can undo this.',
      [['Restore', true, 'primary']]);
    if (!ok) return;
    await change('restoreSnapshot', s.id);
    S.snaps = null; S.open = null; toast('Restored the snapshot of ' + when(s.at) + '.', true); render();
  }));
  app.querySelectorAll('[data-delsnap]').forEach(b => b.onclick = () => attempt(async () => {
    const s = S.snaps.find(x => x.id === +b.dataset.delsnap);
    if (!(await ask('Delete this snapshot?', 'Delete the snapshot of ' + when(s.at) + ' ("' + s.name + '")? This cannot be undone.', [['Delete', true, 'danger']]))) return;
    await api('deleteSnapshot', s.id); S.snaps = null; render();
  }));
  app.querySelectorAll('[data-draft]').forEach(b => b.onclick = () => attempt(async () => {
    const m = memberById(+b.dataset.draft), text = draftSummary(m);
    if (!text) return toast(personName(m) + ' is not on any task yet, so there is nothing to draft from.');
    if ((m.bio_summary || '').trim() && !(await ask('Replace the team summary?', 'This replaces what is written for ' + personName(m) + ' now with a new draft. Save a snapshot first if you may want the current text back.', [['Replace it', true, 'primary']]))) return;
    await change('updateMember', m.id, { version: m.version, bio_summary: text });
  }));
  app.querySelectorAll('[data-removemember]').forEach(b => b.onclick = () => attempt(async () => {
    const id = +b.dataset.removemember, pre = await api('removeMember', id, false);
    const ok = await ask('Remove from the team?', pre.message, [['Remove', true, 'danger']]);
    if (ok) await change('removeMember', id, true);
  }));
  const assign = app.querySelector('select[data-act=assign]');
  if (assign) assign.onchange = () => attempt(async () => {
    const v = assign.value; if (!v) return;
    const first = !S.P.assignments.some(a => a.item_id === S.sel);
    await change('addAssignment', S.sel, v === 'team' ? { is_team: true, weeks: 0, is_lead: false } : { member_id: +v.slice(1), weeks: 0, is_lead: first });
  });
  const under = app.querySelector('select[data-act=moveUnder]');
  if (under) under.onchange = () => attempt(async () => {
    const it = S.P.items.find(i => i.id === S.sel), target = +under.value; if (!target) return;
    const was = S.P.items.find(i => i.id === it.parent_id), dest = { version: it.version, parent_id: target };
    if (was && was.parent_id === target) dest.position = was.position + 1;
    try { await change('updateItem', it.id, dest); }
    catch (e) {
      if (e.code !== 'parent_has_effort') throw e;
      const where = await ask('Where should its effort go?', e.message.replace('the new subtask', 'the item you are moving'), [['Move it into the item you are moving', 'new_child', 'primary'], ['Remove it', 'remove', 'danger']]);
      if (where) await change('updateItem', it.id, Object.assign(dest, { effort_destination: where })); else render();
    }
  });
  // Grouped fields: a member's trips, the travel assumptions and a budget line's amounts save as one list.
  app.querySelectorAll('[data-trip]').forEach(el => el.onchange = () => attempt(() => {
    const [mid, y, j] = el.dataset.trip.split(':').map(Number), m = memberById(mid), ny = S.P.proposal.n_years;
    const trips = Array.from({ length: ny }, (_, k) => ((m.trips || [])[k] || [0, 0]).slice(0, 2).map(v => +v || 0));
    trips[y][j] = num(el.value) || 0;
    return change('updateMember', mid, { version: m.version, trips });
  }));
  app.querySelectorAll('[data-travel]').forEach(el => el.onchange = () => attempt(() => {
    const [k, i] = el.dataset.travel.split(':'), p = S.P.proposal, tr = JSON.parse(JSON.stringify(p.travel || {}));
    tr[k] = (tr[k] || (k === 'days' ? [0, 0] : [0, 0, 0])).slice();
    tr[k][+i] = (num(el.value, el.dataset.num === 'money') || 0) / (el.dataset.pct ? 100 : 1);
    return change('updateProposal', p.id, { version: p.version, travel: tr });
  }));
  app.querySelectorAll('[data-nl]').forEach(el => el.onchange = () => attempt(() => {
    const [rid, y] = el.dataset.nl.split(':').map(Number), r = S.P.nonlabor.find(x => x.id === rid);
    const amounts = Array.from({ length: S.P.proposal.n_years }, (_, k) => +((r.amounts || [])[k] || 0));
    amounts[y] = num(el.value, true) || 0;
    return change('updateNonlabor', rid, { version: r.version, amounts });
  }));
}

start();
</script>
